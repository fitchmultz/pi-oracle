name: Windows Crabbox diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-static-ssh:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Exercise a task-owned non-admin Windows SSH target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/windows-crabbox-diagnostic.ps1
