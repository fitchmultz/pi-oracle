name: Pi compatibility

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        description: Official stable version resolved for this run; blank resolves latest
        type: string
        default: ''
      fork-ref:
        description: Maintained fork commit resolved for this run; blank resolves main
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@f407404914bf6d048e4d952c62711df5103cc7ef # main
    with:
      automation-ref: f407404914bf6d048e4d952c62711df5103cc7ef # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}
