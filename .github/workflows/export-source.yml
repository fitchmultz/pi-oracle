name: export-source

on:
  push:
    branches:
      - feat/prime-agent

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/pi-oracle-source.tgz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: pi-oracle-source
          path: /tmp/pi-oracle-source.tgz
          if-no-files-found: error
